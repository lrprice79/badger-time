name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run tests (UTC, with coverage)
        run: npm test

      - name: Run tests (CET)
        run: npm run test:cet

      - name: Run tests (New York)
        run: npm run test:ny

      - name: Run tests (Los Angeles)
        run: npm run test:la
